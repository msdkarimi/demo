[project]
name = "analytics"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.1.0",
    "duckdb>=1.5.6",
    "matplotlib>=3.11.2",
    "mcp>=2.3.0",
    "neo4j>=6.4.1",
    "networkx>=3.7",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[project.scripts]
plot-embeddings = "taxonomy.plot_embeddings:main"
build-graph = "graph.build:main"
graph-mcp = "graph.mcp_server:main"
plot-subgraph = "graph.plot_subgraph:main"
